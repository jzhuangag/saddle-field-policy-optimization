LunarLanderContinuous-v2:
  n_envs: 16
  n_timesteps: !!float 50
  N_mu: !!float 10
  N_nu: !!float 10
  protagonist_algo: "ppo"
  adversary_algo: "ppo"
  protagonist_optimizer: "adam"
  adversary_optimizer: "adam"
  protagonist_optimizer_kwargs: "dict()"
  adversary_optimizer_kwargs: "dict()"
  protagonist_policy: "MlpPolicy"
  adversary_policy: "MlpPolicy"
  n_steps_protagonist: 128
  n_steps_adversary: 128
  protagonist_kwargs: "dict(batch_size=128,
                            gamma=0.999,
                            learning_rate=3e-4,
                            n_epochs=4,
                            clip_range=0.2,
                            ent_coef=0.01,
                            vf_coef=0.5,
                            max_grad_norm=0.5,
                            gae_lambda=0.98
                            )"
  protagonist_policy_kwargs: "dict(activation_fn=torch.nn.ReLU,
                              net_arch=dict(pi=[64, 64], vf=[64, 64])
                              )"
  adversary_kwargs: "dict(batch_size=128,
                            gamma=0.999,
                            learning_rate=3e-4,
                            n_epochs=4,
                            clip_range=0.2,
                            ent_coef=0.01,
                            vf_coef=0.5,
                            max_grad_norm=0.5,
                            gae_lambda=0.98
                            )"
  adversary_policy_kwargs: "dict(activation_fn=torch.nn.ReLU,
                              net_arch=dict(pi=[64, 64], vf=[64, 64])
                              )"


